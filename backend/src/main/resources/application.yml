spring:
  application:
    name: visitor-system
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.visitor.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: VisitorSystemSecretKey2026ForJwtTokenGenerationMustBe256bitsLong!!
  expiration: 86400000

deepseek:
  api-key: "sk-byrAhNZCh4Ful3rvG7hQweeC2ze3cTD4p3QgBtsZmAtoZmZVWu3QKVpQ8ExGFfoj"
  api-url: https://opencode.ai/zen/v1/chat/completions
  model: deepseek-v4-flash-free
